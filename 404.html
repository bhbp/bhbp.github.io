<sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}"><div style="margin-top:28px;display:flex;flex-wrap:wrap;gap:12px"><x-import component-from-global-scope="BHBPDesignSystem_d81dd5.Button" variant="accent" size="lg" icon-left="arrow-left" href="./" hint-size="180px,56px">Back to Home</x-import><button type="button" style="display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 24px;border:0;border-radius:10px;cursor:pointer;font-family:var(--font-ui);font-weight:600;font-size:16px;color:#FFFFFF;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background 200ms,transform 200ms" style-hover="background:rgba(255,255,255,.12)" style-active="transform:scale(.97)"><x-import component-from-global-scope="BHBPDesignSystem_d81dd5.Icon" name="download" size="{{ 18 }}" hint-size="18px,18px"></x-import>Download Resume</button></div></sc-if>
</div>
<div aria-hidden="true" style="grid-column: {{ bigCol }}; grid-row: 1; display: {{ bigDisplay }}; align-self: end; justify-self: end; padding: 0 0 clamp(16px,3vh,32px); font-family: var(--font-display); font-weight: 700; font-size: clamp(120px,17vw,260px); line-height: .82; letter-spacing: -0.06em; color: var(--ocean-100); user-select: none">404</div>
<nav aria-label="Quick links" style="grid-column:{{ navCol }};grid-row:{{ navRow }};display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-self:end;justify-self:end;max-width:560px;width:100%;padding:{{ navPad }}">
<a href="./#range-of-work" style="text-decoration:none;color:#FFFFFF;border-radius:20px;padding:18px 20px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:6px;transition:background 200ms,transform 200ms" style-hover="background:rgba(255,255,255,.12);transform:translateY(-3px)"><span style="display:flex;color:var(--lagoon-300)"><x-import component-from-global-scope="BHBPDesignSystem_d81dd5.Icon" name="layers" size="{{ 20 }}" hint-size="20px,20px"></x-import></span><span style="font-family:var(--font-ui);font-weight:600;font-size:16px">Range of Work</span><span style="font-family:var(--font-mono);font-size:11px;color:rgba(255,255,255,.6)">8 projects</span></a>
<a href="./#capabilities" style="text-decoration:none;color:#FFFFFF;border-radius:20px;padding:18px 20px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:6px;transition:background 200ms,transform 200ms" style-hover="background:rgba(255,255,255,.12);transform:translateY(-3px)"><span style="display:flex;color:var(--fern-300)"><x-import component-from-global-scope="BHBPDesignSystem_d81dd5.Icon" name="compass" size="{{ 20 }}" hint-size="20px,20px"></x-import></span><span style="font-family:var(--font-ui);font-weight:600;font-size:16px">Capabilities</span><span style="font-family:var(--font-mono);font-size:11px;color:rgba(255,255,255,.6)">5 methodologies</span></a>
<a href="./#industries" style="text-decoration:none;color:#FFFFFF;border-radius:20px;padding:18px 20px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:6px;transition:background 200ms,transform 200ms" style-hover="background:rgba(255,255,255,.12);transform:translateY(-3px)"><span style="display:flex;color:var(--lagoon-300)"><x-import component-from-global-scope="BHBPDesignSystem_d81dd5.Icon" name="factory" size="{{ 20 }}" hint-size="20px,20px"></x-import></span><span style="font-family:var(--font-ui);font-weight:600;font-size:16px">Industries</span><span style="font-family:var(--font-mono);font-size:11px;color:rgba(255,255,255,.6)">15 verticals</span></a>
<button type="button" onClick="{{ openContact }}" style="border:0;cursor:pointer;text-align:left;font:inherit;text-decoration:none;color:#FFFFFF;border-radius:20px;padding:18px 20px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:6px;transition:background 200ms,transform 200ms" style-hover="background:rgba(255,255,255,.12);transform:translateY(-3px)"><span style="display:flex;color:#FFA040"><x-import component-from-global-scope="BHBPDesignSystem_d81dd5.Icon" name="mail" size="{{ 20 }}" hint-size="20px,20px"></x-import></span><span style="font-family:var(--font-ui);font-weight:600;font-size:16px">Let's Connect</span><span style="font-family:var(--font-mono);font-size:11px;color:rgba(255,255,255,.6)">Start a conversation</span></button>
</nav>
<sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}"><div style="grid-column:1;grid-row:4;padding:0 0 48px"><div style="margin-top:0;display:flex;flex-wrap:wrap;gap:12px"><x-import component-from-global-scope="BHBPDesignSystem_d81dd5.Button" variant="accent" size="lg" icon-left="arrow-left" href="./" hint-size="180px,56px">Back to Home</x-import><button type="button" style="display: inline-flex; align-items: center; gap: 10px; height: 56px; padding: 0 24px; border: 0; border-radius: 10px; cursor: pointer; font-family: var(--font-ui); font-weight: 600; font-size: 16px; color: #05182B; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: background 200ms,transform 200ms; background-color: var(--lagoon-50)" style-hover="background:rgba(255,255,255,.12)" style-active="transform:scale(.97)"><x-import component-from-global-scope="BHBPDesignSystem_d81dd5.Icon" name="download" size="{{ 18 }}" hint-size="18px,18px"></x-import>Download Resume</button></div></div></sc-if>
</main>
<x-import component-from-global-scope="BHBPDesignSystem_d81dd5.Dialog" open="{{ dialogOpen }}" on-close="{{ closeContact }}" title="Start a conversation" description="Tell me a little about what you're building and I'll be in touch." hint-size="0px,0px">
<div style="display:grid;gap:16px">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px"><x-import component-from-global-scope="BHBPDesignSystem_d81dd5.Input" label="Name" placeholder="Jane Doe" on-change="{{ setName }}" hint-size="100%,74px"></x-import><x-import component-from-global-scope="BHBPDesignSystem_d81dd5.Input" label="Email" icon-left="mail" type="email" placeholder="you@company.com" on-change="{{ setEmail }}" error="{{ emailErr }}" hint-size="100%,74px"></x-import></div>

<x-import component-from-global-scope="BHBPDesignSystem_d81dd5.Input" label="Message" on-change="{{ setMsg }}" multiline="{{ true }}" rows="{{ 4 }}" placeholder="A few lines is plenty." hint-size="100%,140px"></x-import>
<x-import component-from-global-scope="BHBPDesignSystem_d81dd5.Button" variant="accent" size="lg" icon-right="send" full-width="{{ true }}" on-click="{{ send }}" hint-size="100%,56px">Send message</x-import>
</div>
</x-import>
<sc-if value="{{ toastOn }}" hint-placeholder-val="{{ false }}"><div style="position:fixed;right:clamp(24px,6vw,104px);bottom:100px;z-index:1100"><x-import component-from-global-scope="BHBPDesignSystem_d81dd5.Toast" tone="success" title="Almost there" message="Your email app should open with the note ready to send. I'll reply within two business days." on-close="{{ closeToast }}" hint-size="380px,72px"></x-import></div></sc-if>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { w: typeof window !== "undefined" ? window.innerWidth : 1440, dialogOpen: false, emailErr: "", toastOn: false };
  form = {};
  componentDidMount() { this.onR = () => this.setState({ w: window.innerWidth }); window.addEventListener("resize", this.onR); }
  componentWillUnmount() { window.removeEventListener("resize", this.onR); }
  renderVals() {
    const narrow = this.state.w < 900;
    return {
      dialogOpen: this.state.dialogOpen,
      openContact: () => { this.form = {}; this.setState({ dialogOpen: true, emailErr: "" }); },
      closeContact: () => this.setState({ dialogOpen: false }),
      emailErr: this.state.emailErr,
      setName: (e) => { this.form.name = e.target.value; },
      setEmail: (e) => { this.form.email = e.target.value; if (this.state.emailErr) this.setState({ emailErr: "" }); },
      setMsg: (e) => { this.form.msg = e.target.value; },
      topics: ["New Project", "Consultation", "Contracting", "Education & Training", "Open Position", "Referral"],
      setTopic: (e) => { this.form.topic = e.target.value; },
      send: () => {
        const f = this.form;
        if (!/^\S+@\S+\.\S+$/.test(f.email || "")) { this.setState({ emailErr: "That doesn't look like an email yet." }); return; }
        const subject = (f.topic || "Portfolio inquiry") + (f.name ? " — " + f.name : "");
        const body = (f.msg || "") + "\n\n— " + (f.name || "") + " (" + f.email + ")";
        const link = document.createElement("a");
        link.href = "mailto:billhayesbuildsproducts@gmail.com?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
        link.target = "_top"; document.body.appendChild(link); link.click(); link.remove();
        this.setState({ dialogOpen: false, toastOn: true }); clearTimeout(this.tt); this.tt = setTimeout(() => this.setState({ toastOn: false }), 6000);
      },
      toastOn: this.state.toastOn,
      closeToast: () => this.setState({ toastOn: false }),
      bigCol: narrow ? "1" : "2", bigDisplay: narrow ? "none" : "block",
      gridCols: narrow ? "minmax(0,1fr)" : "minmax(0,1fr) minmax(0,1fr)", navCol: narrow ? "1" : "2", navRow: narrow ? "3" : "2",
      narrow, wide: !narrow, navPad: narrow ? "0 0 24px" : "0 0 clamp(32px,8vh,72px)", crossDisplay: narrow ? "none" : "block", mainPos: narrow ? "relative" : "absolute",
      gridRows: narrow ? "auto auto auto auto" : "minmax(0,1fr) minmax(0,1fr) auto",
      h1Pad: narrow ? "24px 0 0" : "clamp(84px,12vh,110px) 0 clamp(24px,4vh,40px)",
      pPad: narrow ? "16px 0 24px" : "clamp(24px,4vh,40px) 0 32px" };
  }
}
</script>
