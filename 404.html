<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  track(name, extra) { try { (window.dataLayer = window.dataLayer || []).push(Object.assign({ event: "cta_click", cta_name: name, cta_location: "404", page_location: location.href }, extra || {})); } catch (e) {} }
  state = { w: typeof window !== "undefined" ? window.innerWidth : 1440, dialogOpen: false, emailErr: "", toastOn: false };
  form = {};
  componentDidMount() { this.onR = () => this.setState({ w: window.innerWidth }); window.addEventListener("resize", this.onR); }
  componentWillUnmount() { window.removeEventListener("resize", this.onR); }
  renderVals() {
    const narrow = this.state.w < 900;
    return {
      dlResume: () => { this.track("resume_download"); const a = document.createElement("a"); a.href = "assets/William_Hayes_Resume.pdf"; a.download = "William_Hayes_Resume.pdf"; document.body.appendChild(a); a.click(); a.remove(); },
      dialogOpen: this.state.dialogOpen,
      openContact: () => { this.track("connect_click"); this.form = {}; this.setState({ dialogOpen: true, emailErr: "" }); },
      closeContact: () => this.setState({ dialogOpen: false }),
      emailErr: this.state.emailErr,
      setName: (e) => { this.form.name = e.target.value; },
      setEmail: (e) => { this.form.email = e.target.value; if (this.state.emailErr) this.setState({ emailErr: "" }); },
      setMsg: (e) => { this.form.msg = e.target.value; },
      topics: ["New Project", "Consultation", "Contracting", "Education & Training", "Open Position", "Referral"],
      setTopic: (e) => { this.form.topic = e.target.value; },
      send: () => {
        const f = this.form;
        if (!/^\S+@\S+\.\S+$/.test(f.email || "")) { this.setState({ emailErr: "That doesn't look like an email yet." }); return; }
        const subject = (f.topic || "Portfolio inquiry") + (f.name ? " — " + f.name : "");
        const body = (f.msg || "") + "\n\n— " + (f.name || "") + " (" + f.email + ")";
