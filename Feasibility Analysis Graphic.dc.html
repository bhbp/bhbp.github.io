<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="bhbp/styles.css"><script src="bhbp/ds-bundle.js"></script><style>html,body{margin:0;background:var(--surface-page)}a{color:var(--ocean-700)}a:hover{color:var(--ocean-800)}</style></helmet>
<section style="box-sizing:border-box;width:100%;max-width:{{ secMax }};margin:0 auto;padding:{{ secPad }};display:flex;flex-direction:column;gap:28px;background:{{ secBg }}">
<sc-if value="{{ full }}" hint-placeholder-val="{{ true }}"><div style="display:flex;flex-direction:column;gap:12px;max-width:600px">
<div style="font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--lagoon-700);display:flex;align-items:center;gap:10px"><span style="width:8px;height:8px;border-radius:50%;background:var(--blush-400);box-shadow:0 0 0 4px rgba(245,176,195,.3)"></span>Feasibility analysis</div>
<h2 style="margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(30px,4vw,48px);line-height:1.05;letter-spacing:-0.035em;color:var(--text-strong)">Flexible by <span style="background:var(--gradient-flow);-webkit-background-clip:text;background-clip:text;color:transparent">design.</span></h2>
<p style="margin:0;font-family:var(--font-body);font-size:17px;line-height:1.6;color:var(--text-body);text-wrap:pretty">Pick a foundation that can change, pilot small, and scale only what people actually use.</p>
</div></sc-if>
<div ref="{{ cardRef }}" style="border-radius:28px;background:var(--surface-card);box-shadow:{{ cardShadow }};padding:{{ cardPad }};display:flex;flex-direction:column;gap:{{ cardGap }}">

<div style="display:grid;grid-template-columns:{{ cols }};gap:20px 24px">
<div style="display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0">
<div style="display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center"><div style="font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted)">Not this</div><div style="font-family:var(--font-display);font-weight:600;font-size:clamp(16px,1.6vw,20px);letter-spacing:-0.02em;color:var(--text-strong)">Ecompassed Solutions</div></div>
<svg viewBox="0 0 360 260" style="width:100%;height:auto;display:block;overflow:visible" role="img" aria-label="One large enterprise suite is chosen up front, locked into a contract, then the market shifts and the cost to change course climbs.">
<line x1="16" y1="216" x2="344" y2="216" stroke="var(--ink-200)" stroke-width="2"></line>
<rect x="30" y="56" width="214" height="152" rx="14" fill="{{ monoFill }}" style="transition:fill 500ms var(--ease-flow)"></rect>
<text x="137" y="128" text-anchor="middle" font-family="var(--font-mono)" font-size="16" font-weight="600" letter-spacing="1.5" fill="#FFFFFF">ALL-IN-ONE</text>
<text x="137" y="150" text-anchor="middle" font-family="var(--font-mono)" font-size="16" font-weight="600" letter-spacing="1.5" fill="#FFFFFF">SUITE</text>
<g style="opacity:{{ lockOp }};transition:opacity 400ms var(--ease-flow)"><rect x="72" y="20" width="130" height="28" rx="14" fill="var(--ink-100)"></rect><text x="137" y="39" text-anchor="middle" font-family="var(--font-mono)" font-size="13" font-weight="600" letter-spacing="1.2" fill="var(--text-strong)">3-YR CONTRACT</text></g>
<g style="opacity:{{ acqOp }};transition:opacity 400ms var(--ease-flow)"><rect x="82" y="168" width="110" height="28" rx="14" fill="#FFFFFF"></rect><text x="137" y="187" text-anchor="middle" font-family="var(--font-mono)" font-size="13" font-weight="600" letter-spacing="1.2" fill="var(--coral-700)">ACQUIRED</text></g>
<rect x="272" y="56" width="56" height="152" rx="10" fill="var(--coral-500)" style="transform-box:fill-box;transform-origin:50% 100%;transform:scaleY({{ costS }});transition:{{ trans }}"></rect>
<text x="300" y="44" text-anchor="middle" font-family="var(--font-mono)" font-size="13" font-weight="600" fill="var(--coral-700)" style="opacity:{{ costOp }};transition:opacity 400ms var(--ease-flow)">COST</text>
<g font-family="var(--font-mono)" font-size="16" font-weight="600" letter-spacing="1.5" fill="var(--text-muted)"><text x="16" y="248">DAY ONE</text><text x="344" y="248" text-anchor="end">YEAR THREE</text></g>
</svg>
<p style="margin:0;max-width:300px;text-align:center;font-family:var(--font-body);font-size:15px;line-height:1.55;color:var(--text-body);text-wrap:pretty">{{ lCap }}</p>
</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0">
<div style="display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center"><div style="font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--fern-700)">This</div><div style="font-family:var(--font-display);font-weight:600;font-size:clamp(16px,1.6vw,20px);letter-spacing:-0.02em;color:var(--text-strong)">Flexible Core</div></div>
<svg viewBox="0 0 360 260" style="width:100%;height:auto;display:block;overflow:visible" role="img" aria-label="A flexible core holds three small pilot modules. Usage is measured, a module is swapped when the market shifts, and only what users need is scaled.">
<rect x="16" y="186" width="328" height="30" rx="10" fill="var(--ocean-700)"></rect>
<text x="180" y="206" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="600" letter-spacing="1.5" fill="#FFFFFF">FLEXIBLE CORE</text>
<sc-for list="{{ mods }}" as="m" hint-placeholder-count="3">
<rect x="{{ m.x }}" y="40" width="92" height="138" rx="10" fill="none" stroke="var(--ink-200)" stroke-width="2" stroke-dasharray="4 5"></rect>
<g style="transform:translateY({{ m.ty }}px);opacity:{{ m.op }};transition:{{ m.trans }}"><rect x="{{ m.x }}" y="40" width="92" height="138" rx="10" fill="{{ m.fill }}" style="transform-box:fill-box;transform-origin:50% 100%;transform:scaleY({{ m.s }});transition:{{ m.strans }}"></rect></g>
<text x="{{ m.cx }}" y="30" text-anchor="middle" font-family="var(--font-mono)" font-size="13" font-weight="600" letter-spacing="1.2" fill="{{ m.tagFill }}" style="opacity:{{ m.tagOp }};transition:opacity 400ms var(--ease-flow)">{{ m.tag }}</text>
</sc-for>
<g font-family="var(--font-mono)" font-size="16" font-weight="600" letter-spacing="1.5" fill="var(--text-muted)"><text x="16" y="248">PILOT</text><text x="344" y="248" text-anchor="end">SCALE</text></g>
</svg>
<p style="margin:0;max-width:300px;text-align:center;font-family:var(--font-body);font-size:15px;line-height:1.55;color:var(--text-body);text-wrap:pretty">{{ rCap }}</p>
</div>
</div>
<div style="display:flex;align-items:center;justify-content:center;gap:8px;padding-top:2px">
<button aria-label="Previous frame" onClick="{{ prev }}" style="width:44px;height:44px;flex:none;border-radius:10px;border:0;padding:0;background:transparent;color:var(--ocean-700);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:{{ prevOp }};transition:background 200ms var(--ease-flow),opacity 200ms var(--ease-flow)" style-hover="background:var(--lagoon-50)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<div style="display:flex;align-items:center"><sc-for list="{{ dots }}" as="d" hint-placeholder-count="3"><button aria-label="{{ d.label }}" aria-current="{{ d.cur }}" onClick="{{ d.go }}" style="height:44px;min-width:28px;padding:0 4px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="display:block;width:{{ d.w }};height:10px;border-radius:999px;background:{{ d.bg }};transition:width 360ms var(--ease-flow),background 200ms var(--ease-flow)"></span></button></sc-for></div>
<button aria-label="Next frame" onClick="{{ next }}" style="width:44px;height:44px;flex:none;border-radius:10px;border:0;padding:0;background:transparent;color:var(--ocean-700);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:{{ nextOp }};transition:background 200ms var(--ease-flow),opacity 200ms var(--ease-flow)" style-hover="background:var(--lagoon-50)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
</div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1800,&quot;min&quot;:800,&quot;max&quot;:3000,&quot;step&quot;:100,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { s: 0, reset: false, narrow: typeof window !== "undefined" && window.innerWidth < 760 };
  lCaps = ["The biggest suite, chosen on day one.", "Locked into a long, expensive contract.", "The market shifts. The vendor gets acquired.", "Changing course now costs a fortune.", "Changing course now costs a fortune."];
  rCaps = ["A flexible core with small, swappable pilots.", "Real usage shows what people need.", "Market shifts? Swap one module, keep the rest.", "Scale what users actually use.", "Scale what users actually use."];
  cardRef = React.createRef();
  startOnce = () => { if (this.started) return; this.started = true; this.t = setInterval(() => { if (this.state.s >= 3) { clearInterval(this.t); return; } this.setState({ s: this.state.s + 1 }); }, this.props.speed ?? 1800); };
  watch = () => { const el = this.cardRef.current; if (!el || !window.IntersectionObserver) return this.startOnce(); this.io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { this.io.disconnect(); this.startOnce(); } }, { threshold: 0.35 }); this.io.observe(el); };
  goF = (f) => { clearInterval(this.t); this.started = true; this.io && this.io.disconnect(); this.setState({ s: f + 1 }); };
  navVals(f) { const go = (k) => () => this.goF(Math.max(0, Math.min(2, k))); return { cardRef: this.cardRef, prev: go(f - 1), next: go(f + 1), prevOp: f <= 0 ? 0.35 : 1, nextOp: f >= 2 ? 0.35 : 1, dots: [0, 1, 2].map((k) => ({ label: "Frame " + (k + 1) + " of 3", cur: k === f ? "true" : "false", go: go(k), w: k === f ? "24px" : "10px", bg: k === f ? "var(--ocean-700)" : "var(--ink-200)" })) }; }
  componentDidMount() {
    this.watch();
    this.onR = () => { const n = window.innerWidth < 760; if (n !== this.state.narrow) this.setState({ narrow: n }); };
    window.addEventListener("resize", this.onR);
  }
  componentWillUnmount() { clearInterval(this.t); this.io && this.io.disconnect(); window.removeEventListener("resize", this.onR); }
  renderVals() {
    const s = this.state.s, c = !!this.props.compact, rs = this.state.reset;
    const tr = rs ? "none" : "transform 900ms var(--ease-flow)";
    const pilot = 0.22, usage = [0.8, 0.28, 0.55], scaled = [1, 0.28, 0.72];
    const mods = [26, 134, 242].map((x, k) => {
      const swapped = k === 1 && s >= 3;
      const sc = s === 0 ? pilot : s === 1 ? usage[k] : s === 2 ? (k === 1 ? usage[k] : usage[k]) : (k === 1 ? 0.62 : scaled[k]);
      const out = k === 1 && s === 2;
      return {
        x, cx: x + 46, s: sc, strans: rs ? "none" : "transform 900ms var(--ease-flow)",
        ty: out ? -24 : 0, op: out ? 0.35 : 1, trans: rs ? "none" : "transform 500ms var(--ease-flow), opacity 500ms var(--ease-flow)",
        fill: swapped ? "var(--fern-400)" : s >= 1 ? "var(--lagoon-500)" : "var(--lagoon-200)",
        tag: swapped ? "SWAPPED" : out ? "OUTDATED" : s >= 1 ? "USAGE" : "PILOT",
        tagFill: swapped ? "var(--fern-800)" : out ? "var(--coral-700)" : "var(--text-muted)",
        tagOp: 1
      };
    });
    return { ...this.navVals(s - 1),
      full: !c, secMax: c ? "none" : "1080px", secPad: c ? "0" : "clamp(28px,5vw,56px) clamp(20px,4vw,48px)", secBg: c ? "transparent" : "var(--surface-page)",
      cardShadow: c ? "none" : "var(--shadow-md)", cardPad: c ? "20px 24px" : "clamp(20px,3.5vw,40px)", cardGap: c ? "14px" : "20px",
      cols: this.state.narrow ? "minmax(0,1fr)" : "minmax(0,1fr) minmax(0,1fr)",
      trans: rs ? "none" : "transform 1000ms var(--ease-flow)",
      monoFill: s >= 2 ? "var(--ink-400)" : "var(--ocean-700)",
      lockOp: s >= 1 ? 1 : 0, acqOp: s >= 2 ? 1 : 0,
      costS: [0.06, 0.18, 0.45, 1, 1][s], costOp: s >= 1 ? 1 : 0,
      mods, lCap: this.lCaps[s], rCap: this.rCaps[s]
    };
  }
}
</script>
</body>
</html>
